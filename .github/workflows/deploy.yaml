name: Airlines Travel Auto Deploy

on:
 push:
   branches:
     - main


jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ssh deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/airlinessupportdesk

            git stash push --include-untracked -- nginx.conf
            git pull --ff-only origin main

            docker compose down

            docker system prune -f

            docker compose build --no-cache

            docker compose up -d

            docker ps -a